name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # GeneratePackageOnBuild=true produces the package into output/bin/Release
      - name: Build and pack
        run: dotnet build PhiLibrary197.slnx -c Release --nologo

      - name: Verify package exists
        run: ls output/bin/Release/*.nupkg

      # Exchange the GitHub OIDC token for a short-lived NuGet API key (valid 1 hour, one-time use).
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package to nuget.org
        run: dotnet nuget push output/bin/Release/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
